<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chess Rooms</title>
<style>
  :root { --light:#eeeed2; --dark:#6b8f4e; --bg:#1f2326; --panel:#2b3035; --text:#e8e8e8; --accent:#f0b429; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, sans-serif; min-height:100vh; display:flex; justify-content:center; }
  .wrap { width:100%; max-width:520px; padding:14px; }
  h1 { font-size:20px; margin:6px 0 14px; }
  .card { background:var(--panel); border-radius:12px; padding:16px; }
  input, button { font:inherit; border-radius:8px; border:0; padding:12px; width:100%; }
  input { background:#16191c; color:var(--text); margin-bottom:10px; text-transform:none; }
  button { background:var(--accent); color:#222; font-weight:600; cursor:pointer; margin-bottom:8px; }
  button.sec { background:#444b52; color:var(--text); }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  #game { display:none; }
  .bar { display:flex; justify-content:space-between; align-items:center; padding:6px 4px; font-size:15px; }
  .bar .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; background:#777; }
  .bar .turn .dot { background:#4ade80; }
  #board { display:grid; grid-template-columns:repeat(8,1fr); aspect-ratio:1; border-radius:6px; overflow:hidden; user-select:none; touch-action:manipulation; }
  .sq { position:relative; display:flex; align-items:center; justify-content:center; font-size:min(9vw,46px); line-height:1; cursor:pointer; }
  .sq.l { background:var(--light); color:#000; } .sq.d { background:var(--dark); color:#000; }
  .sq.sel { box-shadow: inset 0 0 0 4px #facc15; }
  .sq.last { background-image: linear-gradient(rgba(255,235,59,.45),rgba(255,235,59,.45)); }
  .sq.target::after { content:''; position:absolute; width:28%; height:28%; border-radius:50%; background:rgba(0,0,0,.28); }
  .sq.cap::after { width:86%; height:86%; background:none; border:4px solid rgba(0,0,0,.28); }
  .sq.chk { background-image: radial-gradient(circle, rgba(220,38,38,.9), rgba(220,38,38,0) 70%); }
  .p-w { color:#fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 3px #000; }
  .p-b { color:#111; }
  .coord { position:absolute; font-size:9px; opacity:.55; left:2px; top:1px; pointer-events:none; }
  /* secret assist: invisible unless toggled, and very subtle when shown */
  .sq.a-from::before, .sq.a-to::before { content:''; position:absolute; inset:0; box-shadow: inset 0 0 0 3px rgba(80,160,255,.55); pointer-events:none; }
  #assist { display:none; font-size:12px; opacity:.55; padding:4px 6px; font-family:ui-monospace,monospace; }
  .status { text-align:center; min-height:24px; margin:10px 0 4px; font-weight:600; }
  .moves { font-size:13px; opacity:.8; max-height:70px; overflow:auto; padding:4px; }
  .err { color:#f87171; min-height:18px; font-size:13px; }
  .small { font-size:13px; opacity:.75; }
  dialog { border:0; border-radius:12px; background:var(--panel); color:var(--text); }
  dialog button { width:64px; font-size:34px; padding:6px; background:#444b52; margin:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">♞ Chess Rooms</h1>

  <div id="lobby" class="card">
    <input id="name" placeholder="Your name" maxlength="20" autocomplete="off">
    <button id="create">Create a room</button>
    <div class="small" style="margin:6px 0">or join with a code</div>
    <div class="row">
      <input id="code" placeholder="ROOM CODE" maxlength="5" autocapitalize="characters" style="text-transform:uppercase">
      <button id="join" class="sec">Join</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div id="game">
    <div class="bar" id="topbar"></div>
    <div id="board"></div>
    <div class="bar" id="botbar"></div>
    <div id="assist"></div>
    <div class="status" id="status"></div>
    <div class="moves" id="moves"></div>
    <div class="row" style="margin-top:8px">
      <button class="sec" id="draw">Offer draw</button>
      <button class="sec" id="resign">Resign</button>
    </div>
    <button id="rematch" style="display:none">Rematch (swap colors)</button>
    <div class="small" style="text-align:center;margin-top:6px">Room <b id="roomcode"></b> — <span id="share" style="text-decoration:underline;cursor:pointer">copy invite link</span></div>
  </div>
</div>

<dialog id="promo"><div id="promoBtns"></div></dialog>

<script>
const GLYPH = { k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟' };
const $ = (id) => document.getElementById(id);
let ws, me = null, state = null, selected = null, assist = null, showAssist = false;

// pre-fill from URL / storage
const params = new URLSearchParams(location.search);
$('name').value = localStorage.getItem('chessName') || '';
if (params.get('room')) $('code').value = params.get('room').toUpperCase();

function connect(code) {
  const name = $('name').value.trim() || 'Guest';
  localStorage.setItem('chessName', name);
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'join', name, code }));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'error') { $('err').textContent = m.text; }
    else if (m.type === 'joined') {
      me = m.color; $('lobby').style.display = 'none'; $('game').style.display = 'block';
      $('roomcode').textContent = m.code; history.replaceState(null, '', '?room=' + m.code);
    } else if (m.type === 'state') {
      if (state && state.fen !== m.fen) { assist = null; }
      state = m; me = m.you; selected = null; render();
    } else if (m.type === 'assist') {
      assist = m; renderAssist(); renderBoard();
    }
  };
  ws.onclose = () => { $('status').textContent = 'Disconnected — reload to rejoin'; };
}
$('create').onclick = () => connect('');
$('join').onclick = () => { const c = $('code').value.trim(); if (c) connect(c); };

function parseFen(fen) {
  const rows = fen.split(' ')[0].split('/');
  return rows.map((r) => { const out = []; for (const ch of r) { if (/\d/.test(ch)) for (let i=0;i<+ch;i++) out.push(null); else out.push(ch); } return out; });
}
const files = 'abcdefgh';
const sqName = (r, c) => files[c] + (8 - r);

function render() {
  renderBoard();
  const flipped = me === 'b';
  const top = flipped ? 'w' : 'b', bot = flipped ? 'b' : 'w';
  const bar = (c) => {
    const n = state.players[c] || 'waiting…';
    const active = state.turn === c && !state.status.over;
    return `<span class="${active ? 'turn' : ''}"><span class="dot"></span>${c === 'w' ? '⚪' : '⚫'} ${escapeHtml(n)}</span>` +
           (c === top && state.spectators ? `<span class="small">👁 ${state.spectators}</span>` : '');
  };
  $('topbar').innerHTML = bar(top); $('botbar').innerHTML = bar(bot);
  let s = state.status.text;
  if (!s && !state.players.w || !state.players.b) s = s || 'Waiting for opponent… share the room code';
  if (state.drawOffer && !state.status.over) s = state.drawOffer === me ? 'Draw offered' : 'Opponent offers a draw';
  $('status').textContent = s;
  const mv = state.history; let txt = '';
  for (let i = 0; i < mv.length; i += 2) txt += `${i/2+1}. ${mv[i]} ${mv[i+1] || ''}  `;
  $('moves').textContent = txt; $('moves').scrollTop = 1e6;
  const over = state.status.over, isPlayer = me === 'w' || me === 'b';
  $('rematch').style.display = over && isPlayer ? 'block' : 'none';
  $('draw').style.display = $('resign').style.display = (!over && isPlayer) ? '' : 'none';
  $('draw').textContent = state.drawOffer && state.drawOffer !== me ? 'Accept draw' : 'Offer draw';
  renderAssist();
}

function renderBoard() {
  if (!state) return;
  const grid = parseFen(state.fen), flipped = me === 'b';
  const board = $('board'); board.innerHTML = '';
  const legalFrom = selected ? state.legal.filter((m) => m.from === selected) : [];
  let kingSq = null;
  if (state.status.text === 'Check!' || state.status.text.startsWith('Checkmate')) {
    for (let r=0;r<8;r++) for (let c=0;c<8;c++) if (grid[r][c] === (state.turn === 'w' ? 'K' : 'k')) kingSq = sqName(r,c);
  }
  for (let i = 0; i < 64; i++) {
    const r = flipped ? 7 - Math.floor(i/8) : Math.floor(i/8), c = flipped ? 7 - (i%8) : i%8;
    const name = sqName(r, c), piece = grid[r][c];
    const el = document.createElement('div');
    el.className = 'sq ' + ((r + c) % 2 ? 'd' : 'l');
    if (name === selected) el.classList.add('sel');
    if (state.lastMove && (state.lastMove.from === name || state.lastMove.to === name)) el.classList.add('last');
    if (name === kingSq) el.classList.add('chk');
    const t = legalFrom.find((m) => m.to === name);
    if (t) el.classList.add(piece ? 'cap' : 'target');
    if (showAssist && assist && assist.best && (name === assist.best.slice(0,2))) el.classList.add('a-from');
    if (showAssist && assist && assist.best && (name === assist.best.slice(2,4))) el.classList.add('a-to');
    if (piece) {
      const w = piece === piece.toUpperCase();
      const s = document.createElement('span'); s.className = w ? 'p-w' : 'p-b'; s.textContent = GLYPH[piece.toLowerCase()];
      el.appendChild(s);
    }
    if ((i % 8 === 0) ) { const co = document.createElement('span'); co.className='coord'; co.textContent = flipped ? (r+1) : (8-r); el.appendChild(co); }
    el.onclick = () => clickSquare(name, piece);
    board.appendChild(el);
  }
}

function clickSquare(name, piece) {
  if (!state || state.status.over || state.turn !== me) return;
  if (selected) {
    const cands = state.legal.filter((m) => m.from === selected && m.to === name);
    if (cands.length) {
      if (cands[0].promotion) return askPromotion((p) => send({ type:'move', from:selected, to:name, promotion:p }));
      return send({ type:'move', from:selected, to:name });
    }
  }
  const mine = piece && ((me === 'w') === (piece === piece.toUpperCase()));
  selected = mine && state.legal.some((m) => m.from === name) ? name : null;
  renderBoard();
}
function askPromotion(cb) {
  const d = $('promo'), box = $('promoBtns'); box.innerHTML = '';
  for (const p of ['q','r','b','n']) { const b = document.createElement('button'); b.textContent = GLYPH[p]; b.onclick = () => { d.close(); cb(p); }; box.appendChild(b); }
  d.showModal();
}
function send(o) { ws.send(JSON.stringify(o)); }
$('resign').onclick = () => { if (confirm('Resign?')) send({ type:'resign' }); };
$('draw').onclick = () => send({ type: state.drawOffer && state.drawOffer !== me ? 'acceptDraw' : 'offerDraw' });
$('rematch').onclick = () => send({ type:'rematch' });
$('share').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(location.href); $('share').textContent = 'copied!'; };
function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---- secret assistant UI ----
// The server only ever sends 'assist' to a player named Amit. Even then the overlay stays hidden
// until toggled: press H, or tap the title 3 times (phones).
function renderAssist() {
  const el = $('assist');
  if (!assist || !showAssist) { el.style.display = 'none'; return; }
  let ev = assist.mate != null ? `#${assist.mate}` : (assist.cp != null ? (assist.cp/100).toFixed(2) : '?');
  el.style.display = 'block';
  el.textContent = `${assist.san || assist.best}  ${ev}  d${assist.depth}`;
}
function toggleAssist() { showAssist = !showAssist; renderAssist(); renderBoard(); }
document.addEventListener('keydown', (e) => { if ((e.key === 'h' || e.key === 'H') && document.activeElement.tagName !== 'INPUT') toggleAssist(); });
let taps = 0, tapTimer;
$('title').addEventListener('click', () => { taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => taps = 0, 700); if (taps >= 3) { taps = 0; toggleAssist(); } });
</script>
</body>
</html>
